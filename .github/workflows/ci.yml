# Continuous integration for Graphiq Studio.
#
# Two jobs, split by what they need rather than by what they check: `check` needs
# nothing but Node and finishes in minutes, so a type error or a broken unit test
# reports almost immediately; `e2e` has to boot and drive the real app, sharded
# four ways.
#
# WHY A DEV SERVER AND NOT A PRODUCTION BUILD. The instinct is to test what ships.
# It cannot work here: the harnesses drive the app through dev-only console hooks
# — `__gqRenderCache` (e2e/pixel-identity.spec.ts toggles the render cache to force the
# always-correct uncached path; the region and blend rails use it too) and
# `__gqCrash` (e2e/smoke.spec.ts simulates a crash to test recovery) — and CanvasArea returns
# early from installing them when NODE_ENV is production. Against `next start`
# every browser harness would fail on a missing hook. A production build is still
# compiled, by the `build` step in `check`, so a build-only break is caught.
#
# WHY `chrome` AND NOT `msedge`. playwright-core ships no browsers; it drives an
# installed one. GitHub's ubuntu runners carry Chrome and Edge, so either avoids a
# download — Chrome is the more reliably present of the two. The harnesses default
# to msedge locally and take the channel from $GQ_CHANNEL (tools/lib/launch.js).
# Verified before writing this: the layer-effect goldens (e2e/golden-effects.spec.ts)
# come out IDENTICAL on Chrome and Edge, so pinning a different channel here does
# not invalidate the baselines.
# If a runner image ever drops Chrome, `npx playwright install chromium` plus
# GQ_CHANNEL=chromium is the fallback.
#
# NOT RUN HERE: tools/perf-suite.js and the benches. They measure wall-clock, and
# a shared CI runner's speed varies by more than the thing being measured — the
# perf suite already prints a calibration warning when the machine is off
# baseline, and on a runner it always would be. Performance is tracked locally,
# in one sitting, with interleaved arms.
#
# EVERY TEST RUNS, even after one fails (Playwright's default, `retries: 0` on
# purpose), so one run reports every broken rail rather than the first.
# `tests/ci-workflow.test.ts` parses this file under `npm run check`: from
# 2026-08-25 to 2026-10-16 it did not parse, and no check ran at all.
#
# LINT gates on warnings too: `npm run lint` is `eslint --max-warnings 0`, and the
# tree is clean of both. That is only worth doing once the count is zero — a gate
# that is red on arrival teaches everyone to ignore it — which is why it arrived
# one step after the errors were cleared rather than with them.

name: CI

on:
  push:
    branches: [master]
  pull_request:

# On a pull request a newer push supersedes the in-flight run: only its latest
# commit matters. On master it does NOT: every commit there is a state of the
# main branch worth knowing about, and cancelling meant the ~45-minute browser
# job never finished — six master runs in a row (2026-10-17/18) were cancelled
# by the next push before it could say whether the branch was green.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 rather than the older LTS on purpose: it is the version every
          # harness and the whole unit suite are actually verified on here.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and unit tests
        run: npm run check
      - name: Production build
        run: npm run build

  # Every browser rail, under Playwright Test (e2e/, TODO 2.1). Sharded, so
  # the suite's wall time divides as it grows; each shard starts its own dev
  # server (playwright.config.ts webServer). Four shards since the last of the
  # old `browser` job's 79 hand-rolled harnesses moved here (2026-10-21) — that
  # job alone took ~45 minutes, serially. On a failure the HTML report and per-test traces are uploaded —
  # a trace replays the run step by step, which raw logs cannot.
  e2e:
    name: e2e ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright Test
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          GQ_CHANNEL: chrome
      - name: Upload report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
