# Continuous integration for Graphiq Studio.
#
# Two jobs, split by what they need rather than by what they check: `check` needs
# nothing but Node and finishes in under a minute, so a type error or a broken
# unit test reports almost immediately; `browser` has to build, boot and drive the
# real app, and takes minutes.
#
# WHY A DEV SERVER AND NOT A PRODUCTION BUILD. The instinct is to test what ships.
# It cannot work here: the harnesses drive the app through dev-only console hooks
# — `__gqRenderCache` (pixel-identity toggles the render cache to force the
# always-correct uncached path; the region and blend rails use it too) and
# `__gqCrash` (smoke simulates a crash to test recovery) — and CanvasArea returns
# early from installing them when NODE_ENV is production. Against `next start`
# every browser harness would fail on a missing hook. A production build is still
# compiled, by the `build` step in `check`, so a build-only break is caught.
#
# WHY `chrome` AND NOT `msedge`. playwright-core ships no browsers; it drives an
# installed one. GitHub's ubuntu runners carry Chrome and Edge, so either avoids a
# download — Chrome is the more reliably present of the two. The harnesses default
# to msedge locally and take the channel from $GQ_CHANNEL (tools/lib/launch.js).
# Verified before writing this: golden-effects produces IDENTICAL hashes on Chrome
# and Edge, so pinning a different channel here does not invalidate the baselines.
# If a runner image ever drops Chrome, `npx playwright install chromium` plus
# GQ_CHANNEL=chromium is the fallback.
#
# NOT RUN HERE: tools/perf-suite.js and the benches. They measure wall-clock, and
# a shared CI runner's speed varies by more than the thing being measured — the
# perf suite already prints a calibration warning when the machine is off
# baseline, and on a runner it always would be. Performance is tracked locally,
# in one sitting, with interleaved arms.
#
# LINT gates on warnings too: `npm run lint` is `eslint --max-warnings 0`, and the
# tree is clean of both. That is only worth doing once the count is zero — a gate
# that is red on arrival teaches everyone to ignore it — which is why it arrived
# one step after the errors were cleared rather than with them.

name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 rather than the older LTS on purpose: it is the version every
          # harness and the whole unit suite are actually verified on here.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and unit tests
        run: npm run check
      - name: Production build
        run: npm run build

  browser:
    name: browser harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 rather than the older LTS on purpose: it is the version every
          # harness and the whole unit suite are actually verified on here.
          node-version: 24
          cache: npm
      - run: npm ci

      # Fail here, loudly and early, rather than inside a harness timeout.
      - name: Check the browser this runner provides
        run: |
          which google-chrome-stable google-chrome || true
          google-chrome-stable --version || google-chrome --version

      - name: Start the dev server
        run: |
          npm run dev > dev-server.log 2>&1 &
          echo "waiting for the dev server..."
          for i in $(seq 1 90); do
            if curl -sSf -o /dev/null http://localhost:3000; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "dev server never came up"
          cat dev-server.log
          exit 1

      # Each harness exits non-zero on failure and prints its own PASS/FAIL lines.
      # They are separate steps so the summary names which one broke.
      - name: Smoke (31 checks)
        run: npm run smoke -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Pixel identity — cached render == uncached render
        run: npm run test:pixel -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Golden layer effects
        run: npm run test:fx -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Region-scoped rendering is byte-identical
        run: npm run test:region -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Smart-filter worker agrees with the inline path
        run: npm run test:blend -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: React state sync (render-time adjusts, dock handle)
        run: npm run test:react -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Projects reopen byte-identically in any colour space
        run: npm run test:colorspace -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Tabbed panel groups
        run: npm run test:panels -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Print layout
        run: npm run test:print -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Safe-area insets reach the layout
        run: npm run test:safearea -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: The shell fills the visible viewport
        run: npm run test:viewport -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Each device gets the right shell
        run: npm run test:breakpoint -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: The browser's own gestures stay out of the way
        run: npm run test:gestures -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Work survives the tab going away
        run: npm run test:autosave -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Back closes what is in front, not the app
        run: npm run test:back -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Edge strips stand aside for the canvas
        run: npm run test:edge -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Latched modifiers reach the canvas
        run: npm run test:modifiers -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: A session can be finished or cancelled by touch
        run: npm run test:commit -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Layers reorder by touch, and still by mouse
        run: npm run test:reorder -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Pan mode takes the drag without taking the tool
        run: npm run test:pan -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: A pinch abandons the gesture it interrupts
        run: npm run test:pinch -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Sliders and colour strips are finger-sized
        run: npm run test:targets -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Every control is a 44px hit target on touch
        run: npm run test:hittargets -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: On-canvas handles are catchable by a finger
        run: npm run test:grab -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: The loupe shows the pixels a finger is covering
        run: npm run test:loupe -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: A point placed by tap can be dragged before it counts
        run: npm run test:twostage -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: The clone source can be seen and moved with a finger
        run: npm run test:clonesrc -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Hover-only affordances are reachable without a hover
        run: npm run test:hoveronly -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: The phone opens on a photo-first start card
        run: npm run test:startcard -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Recent pictures are remembered, listed and re-openable
        run: npm run test:recents -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: The tools drawer is a labelled sheet on touch
        run: npm run test:toolsheet -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Every tool's options fit, in a sheet rather than a scrolling bar
        run: npm run test:optionsheet -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: Nothing in the panels drawer is out of reach
        run: npm run test:dockreach -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: The panels are a bottom sheet with three detents
        run: npm run test:panelsheet -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome
      - name: One panel open at a time, and the sheet grows to fit it
        run: npm run test:accordion -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: No panel is stranded outside the phone's one dock
        run: npm run test:stranded -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: The command palette is the phone's primary menu
        run: npm run test:palette -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: The phone's chrome, and the readouts it used to drop
        run: npm run test:chrome -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: Every tour spotlight lands on chrome that exists
        run: npm run test:tour -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: Export reaches the OS share sheet, and falls back intact
        run: npm run test:share -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: The tablet tier — persistent rail, collapsible dock, touch targets
        run: npm run test:tablet -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: Every dialog is a usable full-screen sheet on a phone
        run: npm run test:dialogsheets -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: Dialog previews and rails fit a phone
        run: npm run test:dialoginternals -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: Dialogs stay on screen at every interface scale
        run: npm run test:dialogzoom -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: The software keyboard moves the bar and the focused field
        run: npm run test:keyboard -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: A text session can be finished and abandoned by touch
        run: npm run test:textsession -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: Dialogs do not summon the keyboard, and numeric fields get a keypad
        run: npm run test:kbfields -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: The app is installable, with icons a launcher will not letterbox
        run: npm run test:manifest -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: The iOS home-screen tags, and the notch they make real
        run: npm run test:ioswebapp -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: "More space" offers only what the platform can actually do
        run: npm run test:morespace -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: Installable with no service worker, and the decision behind that
        run: npm run test:installable -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: Documents too big for the browser are refused, not opened blank
        run: npm run test:ceiling -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: Running out of canvas memory is reported, not composited blank
        run: npm run test:canvasmem -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: An open document holds only the buffers it actually needs
        run: npm run test:memfloor -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: Performance budgets follow the device, not the desktop
        run: npm run test:budgets -- --url http://localhost:3000
        env:
          GQ_CHANNEL: chrome

      - name: Dev server log
        if: failure()
        run: cat dev-server.log
